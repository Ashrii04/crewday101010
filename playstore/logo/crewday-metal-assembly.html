<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CrewDay metal logo assembly</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #232a3a 0%, #10131b 55%, #07080c 100%);
    display: grid; place-items: center; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }
  svg { width: min(92vw, 78vh); height: auto; cursor: pointer; display: block; }
  .hint { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; color: #6f7a8c; font-size: 13px; letter-spacing: .08em; }

  .piece, .face, .flash, .spark, .word, .glow { transform-box: fill-box; transform-origin: center; }

  /* Final (resting) state is the default, so the logo is whole without animation. */
  .flash { opacity: 0; }
  .sweep { transform: translateX(-700px); }

  .play .piece { animation: fly 0.95s cubic-bezier(.2, 1.35, .35, 1) both; animation-delay: var(--d); }
  .play .flash { animation: flash 0.5s ease-out forwards; animation-delay: calc(var(--d) + 0.62s); }
  .play .face  { animation: drop 0.7s cubic-bezier(.3, 1.6, .4, 1) 2.0s both; }
  .play .rig   { animation: shake 0.35s linear 2.45s both; }
  .play .spark { animation: pop 0.6s cubic-bezier(.3, 1.8, .4, 1) 2.7s both; }
  .play .sweep { animation: sweep 1.1s ease-in-out 3.0s both; }
  .play .word  { animation: rise 0.9s cubic-bezier(.2, .9, .3, 1) 3.2s both; }
  .play .glow  { animation: glow 1.6s ease-out 2.4s both; }

  @keyframes fly {
    0%   { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(.25); opacity: 0; }
    35%  { opacity: 1; }
    100% { transform: none; opacity: 1; }
  }
  @keyframes flash {
    0%   { transform: scale(.6); opacity: .9; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  @keyframes drop {
    0%   { transform: translate(260px, -40px) scale(.2) rotate(180deg); opacity: 0; }
    60%  { opacity: 1; }
    100% { transform: none; opacity: 1; }
  }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-5px, 2px); }
    40% { transform: translate(4px, -2px); }
    60% { transform: translate(-3px, 1px); }
    80% { transform: translate(2px, 0); }
  }
  @keyframes pop {
    0%   { transform: scale(0) rotate(-90deg); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  @keyframes sweep {
    0%   { transform: translateX(-700px); }
    100% { transform: translateX(700px); }
  }
  @keyframes rise {
    0%   { transform: translateY(26px); opacity: 0; letter-spacing: .5em; }
    100% { transform: none; opacity: 1; }
  }
  @keyframes glow {
    0%   { opacity: 0; transform: scale(.6); }
    40%  { opacity: .9; }
    100% { opacity: .45; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .play * { animation: none !important; }
  }
</style>
</head>
<body>
<svg id="stage" class="play" viewBox="0 0 512 640" role="img" aria-label="CrewDay metal logo assembling">
  <defs>
    <!-- Brushed chrome with a hint of the brand pink and blue in the reflections -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="18%"  stop-color="#c7cfdb"/>
      <stop offset="38%"  stop-color="#6c7687"/>
      <stop offset="52%"  stop-color="#f1f4f8"/>
      <stop offset="68%"  stop-color="#ffb7d3"/>
      <stop offset="82%"  stop-color="#8c9ab0"/>
      <stop offset="100%" stop-color="#9fd0ff"/>
    </linearGradient>
    <linearGradient id="chromeDark" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#eef1f6"/>
      <stop offset="45%"  stop-color="#4b5464"/>
      <stop offset="100%" stop-color="#b9c2cf"/>
    </linearGradient>
    <radialGradient id="dish" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0%"   stop-color="#dfe5ee"/>
      <stop offset="60%"  stop-color="#8590a2"/>
      <stop offset="100%" stop-color="#3d4553"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#fff6d8"/>
      <stop offset="35%"  stop-color="#f3c969"/>
      <stop offset="60%"  stop-color="#a8741f"/>
      <stop offset="80%"  stop-color="#ffe29a"/>
      <stop offset="100%" stop-color="#c9902e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#fff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%"   stop-color="#b98cf5" stop-opacity=".55"/>
      <stop offset="55%"  stop-color="#6db8ff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#6db8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".55"/>
    </filter>

    <!-- One metal disc: outer rim, machined groove, dished centre, highlight -->
    <g id="disc">
      <circle r="58" fill="url(#chrome)"/>
      <circle r="58" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/>
      <circle r="45" fill="url(#chromeDark)"/>
      <circle r="40" fill="url(#dish)"/>
      <path d="M-30 -22 A38 38 0 0 1 10 -37" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"/>
    </g>

    <mask id="logoMask">
      <g fill="#fff">
        <circle cx="340.9" cy="171.1" r="58"/><circle cx="237.2" cy="137.5" r="58"/>
        <circle cx="149.1" cy="201.5" r="58"/><circle cx="149.1" cy="310.5" r="58"/>
        <circle cx="237.2" cy="374.5" r="58"/><circle cx="340.9" cy="340.9" r="58"/>
        <circle cx="382" cy="256" r="34"/>
      </g>
    </mask>
  </defs>

  <circle class="glow" cx="256" cy="256" r="250" fill="url(#halo)"/>

  <g class="rig">
    <!-- The crew: six discs fly in and lock into a C -->
    <g>
      <g class="piece" filter="url(#shadow)" style="--dx:-420px; --dy:-140px; --r:-200deg; --d:.20s"><use href="#disc" x="149.1" y="201.5"/></g>
      <g class="piece" filter="url(#shadow)" style="--dx:-380px; --dy:260px;  --r:160deg;  --d:.45s"><use href="#disc" x="149.1" y="310.5"/></g>
      <g class="piece" filter="url(#shadow)" style="--dx:-60px;  --dy:-420px; --r:240deg;  --d:.70s"><use href="#disc" x="237.2" y="137.5"/></g>
      <g class="piece" filter="url(#shadow)" style="--dx:40px;   --dy:420px;  --r:-180deg; --d:.95s"><use href="#disc" x="237.2" y="374.5"/></g>
      <g class="piece" filter="url(#shadow)" style="--dx:400px;  --dy:-300px; --r:220deg;  --d:1.20s"><use href="#disc" x="340.9" y="171.1"/></g>
      <g class="piece" filter="url(#shadow)" style="--dx:420px;  --dy:320px;  --r:-240deg; --d:1.45s"><use href="#disc" x="340.9" y="340.9"/></g>
    </g>

    <!-- Impact flashes as each disc lands -->
    <g fill="none" stroke="#fff" stroke-width="3">
      <circle class="flash" style="--d:.20s"  cx="149.1" cy="201.5" r="58"/>
      <circle class="flash" style="--d:.45s"  cx="149.1" cy="310.5" r="58"/>
      <circle class="flash" style="--d:.70s"  cx="237.2" cy="137.5" r="58"/>
      <circle class="flash" style="--d:.95s"  cx="237.2" cy="374.5" r="58"/>
      <circle class="flash" style="--d:1.20s" cx="340.9" cy="171.1" r="58"/>
      <circle class="flash" style="--d:1.45s" cx="340.9" cy="340.9" r="58"/>
      <circle class="flash" style="--d:1.95s" cx="382" cy="256" r="34" stroke="#ffe29a"/>
    </g>

    <!-- You: the gold piece that completes the circle -->
    <g class="face" filter="url(#shadow)">
      <circle cx="382" cy="256" r="34" fill="url(#gold)"/>
      <circle cx="382" cy="256" r="34" fill="none" stroke="#fff6d8" stroke-opacity=".8" stroke-width="1.5"/>
      <circle cx="371" cy="250" r="4.2" fill="#3b2606"/>
      <circle cx="393" cy="250" r="4.2" fill="#3b2606"/>
      <path d="M369 262 q13 12 26 0" fill="none" stroke="#3b2606" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <!-- Light sweeping across the finished metal -->
    <g mask="url(#logoMask)">
      <rect class="sweep" x="196" y="40" width="120" height="440" fill="url(#shine)" transform="skewX(-20)"/>
    </g>

    <path class="spark" d="M408 84 L414 106 L436 112 L414 118 L408 140 L402 118 L380 112 L402 106Z" fill="#fff"/>
  </g>

  <text class="word" x="256" y="545" text-anchor="middle" font-size="64" font-weight="800" letter-spacing=".04em"
        fill="url(#chrome)" stroke="#ffffff" stroke-opacity=".35" stroke-width="1">CrewDay</text>
  <text class="word" x="256" y="590" text-anchor="middle" font-size="17" font-weight="600" letter-spacing=".32em" fill="#8f9bb0">FIND YOUR CREW</text>
</svg>
<div class="hint">CLICK TO REPLAY</div>
<script>
  const stage = document.getElementById('stage')
  stage.addEventListener('click', () => {
    stage.classList.remove('play')
    void stage.getBoundingClientRect() // restart the animations
    stage.classList.add('play')
  })
</script>
</body>
</html>
